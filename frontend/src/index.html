<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elhaykal Image Encryption Client</title>
    <meta name="description" content="Encrypt images using steganography with the Elhaykal encryption service">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1>Elhaykal Image Encryption</h1>
                <p class="subtitle">Secure your images using advanced steganography</p>
                <div class="health-status">
                    <div id="healthIndicator" class="health-indicator"></div>
                    <span id="healthStatus">Checking backend...</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <!-- Upload Section -->
                <section id="uploaderContainer" class="section"></section>

                <!-- Action Buttons -->
                <div id="actionButtons" class="action-buttons">
                    <button id="encryptBtn" class="btn btn-primary btn-large" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Encrypt Image
                    </button>
                </div>

                <!-- Result Section -->
                <section id="resultContainer" class="section"></section>

                <!-- Loading Overlay -->
                <div id="loadingContainer"></div>

                <!-- Error Display -->
                <div id="errorContainer"></div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>&copy; 2025 Elhaykal Service. Secure image encryption using steganography.</p>
        </footer>
    </div>
</body>
</html>
